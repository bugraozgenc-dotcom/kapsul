<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title"><title id="title">Kopyala, ara ve yeniden kullan / Copy, find and reuse</title><defs><linearGradient id="bg"><stop stop-color="#edf7ff"/><stop offset="1" stop-color="#e6edfb"/></linearGradient></defs><rect width="1200" height="330" rx="28" fill="url(#bg)"/><g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"><g fill="#fff" stroke="#c2d9f2"><rect x="35" y="40" width="346" height="250" rx="24"/><rect x="427" y="40" width="346" height="250" rx="24"/><rect x="819" y="40" width="346" height="250" rx="24"/></g><g fill="#2b76d2" font-size="48" font-weight="700"><text x="64" y="104">01</text><text x="456" y="104">02</text><text x="848" y="104">03</text></g><g fill="#162f50" font-size="26" font-weight="600"><text x="64" y="158">Kopyala / Copy</text><text x="456" y="158">Bul / Find</text><text x="848" y="158">Kullan / Reuse</text></g><g fill="#536c88" font-size="18"><text x="64" y="202">Metin, link veya görsel</text><text x="64" y="232">Text, link or image</text><text x="456" y="202">Ara, grupları filtrele</text><text x="456" y="232">Search and filter sources</text><text x="848" y="202">Kopyala veya bağlantıyı aç</text><text x="848" y="232">Copy or open the link</text></g><g fill="#72a5de" font-size="30"><text x="394" y="182">→</text><text x="786" y="182">→</text></g></g></svg>