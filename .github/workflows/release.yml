name: Prepare Kapsul release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (x.y.z)'
        required: true
        default: '0.6.0'
      build_number:
        description: 'Build number (must increase for every release)'
        required: true
        default: '6'

permissions:
  contents: write

concurrency:
  group: kapsul-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      COPYGLASS_BUILD_DIR: ${{ runner.temp }}/copyglass-build
      COPYGLASS_VERSION: ${{ inputs.version }}
      COPYGLASS_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require signing secret and validate version
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Set SPARKLE_PRIVATE_KEY in repository Actions secrets first.'; exit 1; }
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'\d+\.\d+\.\d+', os.environ['COPYGLASS_VERSION']), 'Invalid version'
          assert re.fullmatch(r'[1-9]\d*', os.environ['COPYGLASS_BUILD_NUMBER']), 'Invalid build number'
          PY
      - run: scripts/check.sh
      - run: scripts/build-app.sh --release --universal
      - run: scripts/package-dmg.sh
      - name: Sign update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/prepare-update.sh
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          kapsul_tag="v${COPYGLASS_VERSION}"
          gh release create "$kapsul_tag" --draft --target "$GITHUB_SHA" \
            --title "Kapsül ${COPYGLASS_VERSION}" --generate-notes \
            dist/Kapsul-*-universal.dmg dist/Kapsul-*-universal.dmg.sha256 \
            dist/updates/*.zip dist/updates/appcast.xml
